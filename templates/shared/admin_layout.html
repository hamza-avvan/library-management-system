<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>{% block title %}{% endblock %}</title>

  <link rel="stylesheet" href="/static/vendor/fonts.min.css?v=1" />
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons.min.css?v=1" />
  <script src="/static/vendor/jquery.min.js?v=1"></script>
  <script src="/static/vendor/popper.min.js?v=1"></script>
  <script src="/static/vendor/bootstrap.min.js?v=1"></script>

  <link rel="stylesheet" href="/static/bootstrap.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/css/components.css?v=3" />
  <link rel="stylesheet" href="/static/css/layouts/shared.css?v=1" />
  <link rel="stylesheet" href="/static/css/layouts/admin.css?v=2" />

  {% block head %}{% endblock %}
</head>

<body {% if g and g.bg == 1 %}class="home"{% endif %}>

  <!-- ============================================
       Admin navbar
       ============================================ -->
  <nav class="site-navbar">
    <div class="site-navbar-inner">

      <!-- Brand -->
      <a href="/admin/" class="site-brand">
        <span class="site-brand-mark admin-brand-mark"><i class="bi bi-shield-lock-fill"></i></span>
        <span class="site-brand-text">Admin Console</span>
      </a>

      <!-- Menu -->
      <ul class="site-nav-menu">

        <!-- Quick "View Site" — jumps to user dashboard -->
        <li>
          <a href="/" class="admin-nav-quick" title="View the public site">
            <i class="bi bi-box-arrow-up-right"></i>
            <span class="nav-label">View Site</span>
          </a>
        </li>

        {% if g and g.user %}
          <li>
            <a href="/admin/" class="site-nav-link {% if request.path == '/admin/' %}is-active{% endif %}">
              <i class="bi bi-house-door-fill"></i>
              <span class="nav-label">Home</span>
            </a>
          </li>

          <li>
            <a href="#" class="site-nav-link site-nav-toggle {% if '/books' in request.path %}is-active{% endif %}" data-toggle="dropdown"
               role="button" aria-haspopup="true" aria-expanded="false">
              <i class="bi bi-journal-bookmark-fill"></i>
              <span class="nav-label">Manage Books</span>
              <i class="bi bi-chevron-down site-nav-caret"></i>
            </a>
            <div class="dropdown-menu site-dropdown">
              <a class="dropdown-item" href="/admin/books/">
                <i class="bi bi-view-list"></i> View Books
              </a>
              <a class="dropdown-item" href="/admin/books/add">
                <i class="bi bi-journal-plus"></i> Add Book
              </a>
            </div>
          </li>

          <li>
            <a href="/admin/users/view/" class="site-nav-link {% if '/admin/users' in request.path %}is-active{% endif %}">
              <i class="bi bi-people-fill"></i>
              <span class="nav-label">Manage Users</span>
            </a>
          </li>

          <li>
            <a href="/admin/signout" class="site-nav-link site-nav-signout">
              <i class="bi bi-box-arrow-right"></i>
              <span class="nav-label">Sign out</span>
            </a>
          </li>
        {% else %}
          <li>
            <a href="/admin/signin" class="site-nav-link">
              <i class="bi bi-box-arrow-in-right"></i>
              <span class="nav-label">Sign in</span>
            </a>
          </li>
        {% endif %}

      </ul>

    </div>
  </nav>

  <!-- ============================================
       Page content
       ============================================ -->
  <main class="container-fluid">
    {% block content %}{% endblock %}
  </main>



</body>
</html>
